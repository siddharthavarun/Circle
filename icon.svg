<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#48a8ff"/>
      <stop offset="0.55" stop-color="#0a74f0"/>
      <stop offset="1" stop-color="#0047c2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3efff"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g filter="url(#soft)">
    <circle cx="512" cy="512" r="262" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="84"/>
    <circle cx="512" cy="512" r="262" fill="none" stroke="url(#arc)" stroke-width="84" stroke-linecap="round"
      stroke-dasharray="1646.3" stroke-dashoffset="411.6" transform="rotate(-90 512 512)"/>
    <circle cx="512" cy="512" r="78" fill="#ffffff"/>
  </g>
</svg>
